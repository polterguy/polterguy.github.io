
# The next line declares you want to use this theme
remote_theme: mmistakes/minimal-mistakes@4.23.0

# Title of your site
title: Magic Cloud
subtitle: Where the Machine Creates the Code
description: AI-based Low-Code and No-Code Software Development Automation using Workflows, Software Development Orchestration and AI
repository: "polterguy/magic"
footer_scripts:
 - "https://ainiro.io/magic/system/openai/include-chatbot.js?rtl=false&follow_up=true&type=magic-documentation&header=Ask%20me%20about%20Magic%20Cloud%20and%20Hyperlambda&button=Ask%20Me%20Anything&placeholder=Ask%20me%20anything%20about%20Hyperlambda%20or%20Magic%20Cloud%20...&color=%23f5f5f4&start=%232a2016&end=%23120d0a&link=%23d8b98a&theme=modern-square&code=true&v=warm1"
atom_feed:
  hide: true
og_image: "/assets/images/magic-documentation.png"

# Rendered by the theme's masthead, to the left of the site title.
logo: "/assets/images/logo-yellow.svg"
breadcrumbs: true

# Unlocks the theme's Twitter/X card tags — it emits none at all without a
# username, which left X falling back to the small summary card.
twitter:
  username: AIniroTeam

# Structured data. Without this the theme emits a Person with a null name,
# because it falls back to site.name, which this site does not set.
social:
  type: Organization
  name: Magic Cloud
  links:
    - "https://x.com/AIniroTeam"
    - "https://www.linkedin.com/in/thomas-hansen-ainiro/"
    - "https://github.com/polterguy/magic"

# Copyright displayed in the bottom right corner
copyright: Copyright © Thomas Hansen, 2019 - 2026

minimal_mistakes_skin: dark
locale: "en"
url: "https://docs.ainiro.io"

# Additional plugins to use
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

defaults:
  - values:
      layout: single
      toc: true
      sidebar:
        nav: "docs"

